# Keeps the free-tier Render backend warm by pinging /api/health every
# 14 minutes (Render sleeps instances after ~15 min idle; free tier has
# no "always on" setting). Runs on GitHub's free runners for public repos.
name: Backend keep-alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch: {} # allow manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://ev-gap-backend-lqmy.onrender.com/api/health)
          echo "health status: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::health check returned $code — backend may need attention"
          fi
